services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dermainsight
      POSTGRES_USER: derma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U derma -d dermainsight]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg2://derma:${POSTGRES_PASSWORD}@db:5432/dermainsight
      DERMA_STORAGE: /app/data
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://derma:${POSTGRES_PASSWORD}@db:5432/dermainsight
      DERMA_API_TOKEN: ${DERMA_API_TOKEN:?Set DERMA_API_TOKEN}
      DERMA_STORAGE: /app/data
    volumes:
      - research:/app/data
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
volumes:
  postgres:
  research:
