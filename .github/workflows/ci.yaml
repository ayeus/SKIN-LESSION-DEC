name: Verified research software
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-linux-cpu.lock
      - name: Install complete locked CPU runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements-linux-cpu.lock
      - name: Verify algorithms, access control and actual isolated training
        run: .venv/bin/python -m pytest backend/tests -q -rs
      - name: Verify PostgreSQL migrations and persistence
        run: .venv/bin/python -m scripts.check_postgres
  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-base.lock
      - name: Install real API dependencies for isolated browser workflows
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements-base.lock
      - run: npm ci
        working-directory: frontend
      - name: Type check, component tests and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test
          npm run build
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - name: Real desktop/mobile workflows and accessibility checks
        run: npm run test:browser
        working-directory: frontend
      - name: Retain isolated browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-browser-verification
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
